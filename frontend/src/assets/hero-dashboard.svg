<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Illustration of a secure banking dashboard with balance card and spending chart" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0b2037" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Main dashboard panel -->
  <rect x="40" y="40" width="440" height="340" rx="24" fill="url(#panel)" filter="url(#shadow)"/>

  <!-- Header row -->
  <circle cx="78" cy="80" r="12" fill="#2563eb"/>
  <rect x="98" y="72" width="110" height="14" rx="7" fill="#102d4b"/>
  <rect x="372" y="70" width="68" height="20" rx="10" fill="#dcfce7"/>
  <text x="406" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#15803d">Active</text>

  <!-- Balance card -->
  <rect x="72" y="112" width="376" height="120" rx="18" fill="url(#card)"/>
  <text x="96" y="150" font-family="Inter, sans-serif" font-size="13" fill="#dbeafe">Total Balance</text>
  <text x="96" y="186" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">GHS 12,480.50</text>
  <rect x="96" y="200" width="150" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="412" cy="150" r="22" fill="#ffffff" opacity="0.15"/>
  <circle cx="392" cy="150" r="22" fill="#ffffff" opacity="0.25"/>

  <!-- Spending chart -->
  <text x="96" y="268" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#102d4b">Monthly Activity</text>
  <g>
    <rect x="96"  y="300" width="26" height="40" rx="6" fill="#bfdbfe"/>
    <rect x="140" y="286" width="26" height="54" rx="6" fill="#60a5fa"/>
    <rect x="184" y="312" width="26" height="28" rx="6" fill="#bfdbfe"/>
    <rect x="228" y="272" width="26" height="68" rx="6" fill="#2563eb"/>
    <rect x="272" y="296" width="26" height="44" rx="6" fill="#5eead4"/>
    <rect x="316" y="282" width="26" height="58" rx="6" fill="#14b8a6"/>
    <rect x="360" y="306" width="26" height="34" rx="6" fill="#86efac"/>
    <rect x="404" y="290" width="26" height="50" rx="6" fill="#22c55e"/>
  </g>

  <!-- Floating secure badge -->
  <g filter="url(#shadow)">
    <circle cx="452" cy="300" r="40" fill="#ffffff"/>
    <path d="M452 280 l16 7 v12 c0 11 -7 18 -16 22 c-9 -4 -16 -11 -16 -22 v-12 z" fill="#16a34a"/>
    <path d="M445 300 l5 5 l9 -11" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
